<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Persiapan TKA 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6FB;--card:#fff;--ink:#172033;--mu:#5B6578;--line:#DDE3EF;--pri:#3B5BDB;--ok:#1B7A44;--okb:#E3F6EA;--bad:#C92A2A;--badb:#FDE8E8}
@media(prefers-color-scheme:dark){:root{--bg:#0F1524;--card:#18203A;--ink:#EAEFFA;--mu:#9AA6BF;--line:#2B3556;--pri:#4C6EF5;--ok:#5BD58A;--okb:#12301F;--bad:#FF8A8A;--badb:#3A1717}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 'Plus Jakarta Sans',system-ui,sans-serif}
.w{max-width:880px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;padding:10px 0 4px}
.brand{font-weight:800;color:var(--ink);text-decoration:none}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
nav a{flex:none;padding:6px 12px;border:1px solid var(--line);border-radius:99px;color:var(--ink);text-decoration:none;font-size:14px}
nav a.on{background:var(--c,var(--pri));border-color:transparent;color:#fff}
main{padding-top:8px;padding-bottom:32px;min-height:70vh}
h1{font-size:clamp(28px,6.5vw,42px);line-height:1.15;font-weight:800;margin:20px 0 8px}
h2{font-size:22px;margin:24px 0 8px}h3{margin:10px 0 4px}h4{margin:14px 0 4px}
p{margin:0 0 10px}.mu{color:var(--mu)}.sm{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin:12px 0}
.grid .card{margin:0}
.sc{display:block;color:inherit;text-decoration:none;border-left:6px solid var(--c)}
.ic{width:40px;height:40px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.sp{justify-content:space-between;margin:12px 0}
input{flex:1;min-width:0;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 18px;background:var(--c,var(--pri));color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.pb{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0}
.pb i{display:block;height:100%;background:var(--c,var(--pri))}
.hd{display:flex;gap:14px;align-items:center;margin-top:16px}.hd h1{margin:0}.hd p{margin:0;color:var(--mu)}
.ng{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ng button{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.ng .d{background:var(--c);color:#fff;border-color:transparent}.ng .cur{outline:2px solid var(--ink)}
.op{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:11px 12px;margin:8px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
button.op{cursor:pointer}
.op b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px}
.op.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card))}
.op.ok{border-color:var(--ok);background:var(--okb)}.op.no{border-color:var(--bad);background:var(--badb)}
.bd{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;margin-bottom:6px}
.bd.ok{background:var(--okb);color:var(--ok)}.bd.no{background:var(--badb);color:var(--bad)}.bd.na{background:var(--bg);color:var(--mu)}
.ex{margin-top:12px;padding:12px;border-radius:10px;border-left:4px solid}.ex.ok{background:var(--okb);border-color:var(--ok)}.ex.no{background:var(--badb);border-color:var(--bad)}.ex p{margin:4px 0 0}
.res{text-align:center}.big{font-size:56px;font-weight:800;line-height:1.1}.res .row{justify-content:center}
.pr{overflow-wrap:anywhere}
.pr blockquote{margin:10px 0;padding:8px 14px;border-left:4px solid var(--c,var(--pri));background:var(--bg);border-radius:0 8px 8px 0}
.pr pre{background:var(--bg);padding:12px;border-radius:8px;overflow-x:auto}
.tw{overflow-x:auto;margin:10px 0}table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;font-size:14px}th{background:var(--bg)}
.mb{text-align:center;margin:8px 0;font-size:18px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0}summary{padding:14px 16px;font-weight:600;cursor:pointer}.dt{padding:0 16px 12px}
.ck{display:flex;gap:10px;padding:8px 0;cursor:pointer}.ck input{flex:none;width:20px;height:20px;margin-top:3px;padding:0}
footer{padding-bottom:28px}
</style></head><body>

<script>
const D={"subj": [{"id": "indo", "n": "Bahasa Indonesia", "c": "#C2255C", "g": "Id", "topics": [{"t": "Kompetensi yang Diuji", "h": "<p>TKA Bahasa Indonesia menekankan keterampilan membaca pada teks informasi tunggal/jamak dan teks fiksi.</p><p>Kemampuan yang diuji:</p><ol><li>Menemukan informasi tersurat.</li><li>Memahami informasi tersirat.</li><li>Menentukan ide pokok dan gagasan pendukung.</li><li>Menyimpulkan isi bacaan.</li><li>Menafsirkan makna kata, istilah, dan ungkapan.</li><li>Menilai argumen, fakta, opini, dan sikap penulis.</li><li>Menghubungkan informasi dari lebih dari satu teks.</li></ol>"}, {"t": "Ide Pokok dan Gagasan Pendukung", "h": "<p><b>Ide pokok</b> adalah gagasan utama yang menjadi inti paragraf.<br><b>Gagasan pendukung</b> adalah penjelasan, contoh, data, atau alasan yang memperkuat ide pokok.</p><p>Ciri ide pokok:</p><ul><li>Bersifat umum.</li><li>Dapat mewakili seluruh isi paragraf.</li><li>Sering berada di kalimat pertama, terakhir, atau di tengah paragraf.</li><li>Tidak berupa contoh atau detail kecil.</li></ul><p>Contoh:</p><blockquote>Sampah plastik masih menjadi persoalan lingkungan utama di banyak kota. Meskipun sejumlah daerah telah menerapkan pembatasan plastik sekali pakai, volume sampah plastik belum menurun secara signifikan. Salah satu penyebabnya adalah rendahnya partisipasi masyarakat dalam memilah sampah sejak dari rumah.</blockquote><p>Ide pokok: sampah plastik masih menjadi persoalan utama.<br>Gagasan pendukung: pembatasan plastik belum efektif dan partisipasi masyarakat masih rendah.</p>"}, {"t": "Fakta dan Opini", "h": "<div class=\"tw\"><table><tr><th>Aspek</th><th>Fakta</th><th>Opini</th></tr><tr><td>Sifat</td><td>Dapat dibuktikan</td><td>Bersifat penilaian</td></tr><tr><td>Bahasa</td><td>Data, angka, kejadian</td><td>Kata seperti seharusnya, menurut saya, sebaiknya</td></tr><tr><td>Contoh</td><td>“Suhu air mendidih pada 100°C di tekanan 1 atm.”</td><td>“Menurut saya, belajar daring lebih menyenangkan.”</td></tr></table></div><p>Kata tanda opini: <i>sebaiknya, seharusnya, sepertinya, menurut penulis, patut, layak, penting</i>.</p>"}, {"t": "Makna Kata dan Ungkapan", "h": "<p>Untuk menentukan makna kata:</p><ol><li>Baca kalimat sebelum dan sesudah kata tersebut.</li><li>Perhatikan kata penghubung seperti <i>yaitu, karena, sehingga, tetapi, namun</i>.</li><li>Ganti kata dengan pilihan jawaban.</li><li>Pilih makna yang membuat kalimat tetap logis.</li></ol><p>Contoh:</p><blockquote>Pemerintah mendorong masyarakat untuk melakukan penghematan energi.</blockquote><p>Kata <i>penghematan</i> berarti pengurangan penggunaan, bukan pemborosan.</p>"}, {"t": "Menyimpulkan Teks", "h": "<p>Simpulan harus:</p><ul><li>Didukung oleh informasi teks.</li><li>Tidak melebihi informasi yang diberikan.</li><li>Tidak bertentangan dengan isi teks.</li><li>Bersifat umum, tetapi tetap tepat.</li></ul><p>Hindari kesimpulan yang terlalu ekstrem, misalnya “semua orang”, “selalu”, “tidak pernah”, kecuali teks secara jelas menyatakannya.</p>"}, {"t": "Teks Eksposisi dan Argumentasi", "h": "<p>Teks eksposisi bertujuan memaparkan gagasan.<br>Teks argumentasi bertujuan meyakinkan pembaca dengan alasan dan bukti.</p><p>Struktur:</p><ol><li>Tesis: pernyataan awal atau sikap penulis.</li><li>Argumen: alasan dan bukti pendukung.</li><li>Penegasan ulang: simpulan atau penegasan sikap.</li></ol>"}], "pas": "<p><b>Bacalah teks berikut.</b></p><blockquote>Belajar mandiri merupakan kemampuan penting bagi pelajar. Siswa yang terbiasa belajar mandiri cenderung lebih mampu mengatur waktu, mencari sumber belajar, dan mengevaluasi pemahamannya sendiri. Namun, belajar mandiri bukan berarti belajar tanpa bantuan. Siswa tetap memerlukan arahan guru, dukungan orang tua, dan diskusi dengan teman. Oleh karena itu, sekolah perlu membiasakan siswa menyusun rencana belajar serta memberi ruang untuk bertanya dan berdiskusi.</blockquote>", "qs": [{"q": "<p>Ide pokok teks tersebut adalah …</p>", "o": ["Guru tidak diperlukan dalam belajar mandiri.", "Belajar mandiri penting tetapi tetap memerlukan dukungan.", "Siswa harus belajar tanpa bantuan siapa pun.", "Orang tua harus mengatur seluruh waktu belajar siswa.", "Diskusi dengan teman menghambat belajar mandiri."], "a": 1, "e": "teks menekankan pentingnya belajar mandiri sekaligus perlunya arahan dan dukungan."}, {"q": "<p>Makna kata “membiasakan” adalah …</p>", "o": ["memaksa", "melarang", "menumbuhkan kebiasaan", "menghentikan", "mengabaikan"], "a": 2, "e": "“membiasakan” berarti menumbuhkan kebiasaan."}, {"q": "<p>Simpulan yang tepat adalah …</p>", "o": ["Belajar mandiri hanya dilakukan di rumah.", "Guru tidak boleh membantu siswa.", "Belajar mandiri efektif apabila didukung lingkungan belajar.", "Semua siswa sudah mampu belajar mandiri.", "Diskusi tidak penting bagi pelajar."], "a": 2, "e": "teks menyebut perlunya arahan guru, dukungan orang tua, dan diskusi."}]}, {"id": "ing", "n": "Bahasa Inggris", "c": "#1971C2", "g": "En", "topics": [{"t": "Kompetensi yang Diuji", "h": "<p>TKA Bahasa Inggris berfokus pada reading comprehension.</p><p>Kompetensi:</p><ol><li>Textual understanding: memahami informasi eksplisit.</li><li>Inferential understanding: menyimpulkan informasi tersirat.</li><li>Evaluation and appreciation: menilai tujuan, sudut pandang, dan pesan teks.</li></ol>"}, {"t": "Main Idea", "h": "<p>Main idea adalah gagasan utama teks atau paragraf.</p><p>Cara menemukan main idea:</p><ol><li>Baca kalimat pertama dan terakhir.</li><li>Cari kata yang berulang.</li><li>Perhatikan kalimat yang merangkum seluruh paragraf.</li><li>Hindari detail kecil sebagai main idea.</li></ol>"}, {"t": "Vocabulary in Context", "h": "<p>Jangan langsung menerjemahkan kata secara harfiah. Gunakan konteks kalimat.</p><p>Contoh:</p><blockquote>The new app is user-friendly because students can easily navigate its menus.</blockquote><p><i>User-friendly</i> berarti mudah digunakan.</p>"}, {"t": "Reference Words", "h": "<p>Kata rujukan mengacu pada kata sebelumnya.</p><div class=\"tw\"><table><tr><th>Kata</th><th>Biasanya merujuk pada</th></tr><tr><td>it</td><td>benda/tunggal</td></tr><tr><td>they</td><td>benda/orang/jamak</td></tr><tr><td>this</td><td>hal yang baru disebut</td></tr><tr><td>these</td><td>hal jamak</td></tr><tr><td>which</td><td>benda/hal</td></tr><tr><td>who</td><td>orang</td></tr></table></div>"}, {"t": "Inference", "h": "<p>Inference adalah kesimpulan yang tidak tertulis langsung, tetapi dapat ditarik dari petunjuk teks.</p><p>Contoh:</p><blockquote>Rina arrived late because the bus broke down. She apologized to her teacher.</blockquote><p>Inference: Rina mungkin tidak ingin terlambat dan merasa menyesal.</p>"}, {"t": "Jenis Teks", "h": "<div class=\"tw\"><table><tr><th>Jenis teks</th><th>Tujuan</th><th>Ciri</th></tr><tr><td>Narrative</td><td>Menghibur/menceritakan</td><td>Ada konflik dan penyelesaian</td></tr><tr><td>Descriptive</td><td>Menggambarkan</td><td>Menjelaskan ciri objek</td></tr><tr><td>Procedure</td><td>Menginstruksikan</td><td>Ada langkah-langkah</td></tr><tr><td>Recount</td><td>Menceritakan pengalaman</td><td>Urutan kejadian lampau</td></tr><tr><td>Report</td><td>Memberi informasi umum</td><td>Berisi fakta</td></tr><tr><td>Exposition</td><td>Meyakinkan</td><td>Ada argument dan recommendation</td></tr></table></div>"}], "pas": "<p><b>Read the text.</b></p><blockquote>Recycling is one of the simplest ways to reduce waste. When people recycle paper, plastic, and glass, these materials can be processed into new products. This process saves natural resources and reduces pollution. However, recycling will only work if people separate their waste correctly. Therefore, schools and communities should provide clear information about recycling.</blockquote>", "qs": [{"q": "<p>What is the main idea of the text?</p>", "o": ["Recycling is difficult for most people.", "Recycling helps reduce waste if people do it correctly.", "Schools should stop teaching recycling.", "Plastic cannot be recycled.", "Pollution cannot be reduced."], "a": 1, "e": "teks menyatakan recycling mengurangi limbah tetapi harus didukung pemilahan yang benar."}, {"q": "<p>The word “these” refers to …</p>", "o": ["schools", "communities", "paper, plastic, and glass", "new products", "natural resources"], "a": 2, "e": "“these materials” merujuk pada paper, plastic, and glass."}, {"q": "<p>What can be inferred from the text?</p>", "o": ["Recycling is useless without correct waste separation.", "People do not need information about recycling.", "All waste can be recycled easily.", "Recycling increases pollution.", "Communities should not be involved in recycling."], "a": 0, "e": "teks menyebut recycling hanya berhasil jika sampah dipilah dengan benar."}]}, {"id": "mtk", "n": "Matematika", "c": "#B35C00", "g": "∑", "topics": [{"t": "Bilangan", "h": "<h4>a. Operasi bilangan</h4><p>Urutan operasi: kurung, pangkat/akar, perkalian-pembagian, penjumlahan-pengurangan.</p><p>Contoh:<br><span class=\"m\">8 + 2 × (5 - 3)<sup>2</sup> = 8 + 2 × 4 = 16</span></p><h4>b. Pecahan, desimal, dan persen</h4><ul><li>Pecahan ke persen: kalikan 100.</li><li>Persen ke pecahan: bagi dengan 100.</li><li>Diskon: harga akhir = harga awal - diskon.</li></ul><p>Contoh:<br>Harga Rp80.000 dengan diskon 25%:<br>Diskon = 25% × 80.000 = 20.000<br>Harga akhir = 60.000</p><h4>c. Rasio dan skala</h4><p>Rasio <span class=\"m\">a : b</span> berarti perbandingan dua besaran.</p><p>Contoh:<br>Jumlah siswa laki-laki dan perempuan 3 : 5. Jika total 40 siswa, maka:<br>Laki-laki = <span class=\"m\">3/8 × 40 = 15</span><br>Perempuan = <span class=\"m\">5/8 × 40 = 25</span></p>"}, {"t": "Aljabar", "h": "<h4>a. Bentuk aljabar</h4><p>Contoh: <span class=\"m\">3x + 2y - 5</span>.<br>Koefisien <span class=\"m\">x</span> adalah 3, koefisien <span class=\"m\">y</span> adalah 2, konstanta adalah -5.</p><h4>b. Persamaan linear satu variabel</h4><p>Contoh:<br><span class=\"m\">4x - 7 = 21</span><br><span class=\"m\">4x = 28</span><br><span class=\"m\">x = 7</span></p><h4>c. Pertidaksamaan linear</h4><p>Jika kedua ruas dikali atau dibagi bilangan negatif, tanda pertidaksamaan berbalik.</p><p>Contoh:<br><span class=\"m\">-2x &gt; 8</span><br><span class=\"m\">x &lt; -4</span></p><h4>d. Sistem persamaan linear dua variabel</h4><p>Contoh:<br><span class=\"m\">2x + y = 10</span><br><span class=\"m\">x - y = 2</span></p><p>Jumlahkan:<br><span class=\"m\">3x = 12</span><br><span class=\"m\">x = 4</span><br>Substitusi: <span class=\"m\">4 - y = 2</span>, maka <span class=\"m\">y = 2</span>.</p><h4>e. Fungsi dan invers</h4><p>Jika <span class=\"m\">f(x) = 2x + 3</span>, maka:<br><span class=\"m\">f(4) = 2(4) + 3 = 11</span></p><p>Invers:<br><span class=\"m\">y = 2x + 3</span><br><span class=\"m\">x = (y - 3)/2</span><br><span class=\"m\">f<sup>-1</sup>(x) = (x - 3)/2</span></p><h4>f. Barisan dan deret</h4><p>Barisan aritmetika:<br><span class=\"m\">Un = a + (n - 1)b</span><br><span class=\"m\">Sn = n/2 [2a + (n - 1)b]</span></p><p>Contoh:<br>Barisan 3, 7, 11, … memiliki <span class=\"m\">a = 3</span> dan <span class=\"m\">b = 4</span>.<br>Suku ke-10: <span class=\"m\">3 + 9(4) = 39</span>.</p>"}, {"t": "Geometri dan Pengukuran", "h": "<h4>a. Bangun datar</h4><ul><li>Luas persegi = <span class=\"m\">s<sup>2</sup></span></li><li>Luas persegi panjang = <span class=\"m\">p × l</span></li><li>Luas segitiga = <span class=\"m\">1/2 × a × t</span></li><li>Luas lingkaran = <span class=\"m\">π r<sup>2</sup></span></li><li>Keliling lingkaran = <span class=\"m\">2π r</span></li></ul><h4>b. Teorema Pythagoras</h4><p>Pada segitiga siku-siku:<br><span class=\"m\">c<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup></span></p><p>Contoh:<br>Sisi tegak 6 cm dan 8 cm:<br><span class=\"m\">c = √(36 + 64) = 10</span> cm.</p><h4>c. Bangun ruang</h4><ul><li>Volume balok = <span class=\"m\">p × l × t</span></li><li>Volume kubus = <span class=\"m\">s<sup>3</sup></span></li><li>Volume tabung = <span class=\"m\">π r<sup>2</sup> t</span></li><li>Volume kerucut = <span class=\"m\">1/3 π r<sup>2</sup> t</span></li><li>Volume bola = <span class=\"m\">4/3 π r<sup>3</sup></span></li></ul>"}, {"t": "Data dan Peluang", "h": "<h4>a. Statistika</h4><p>Mean = jumlah data / banyak data.<br>Median = nilai tengah data terurut.<br>Modus = data yang paling sering muncul.</p><p>Contoh:<br>Data 5, 7, 7, 8, 10.<br>Mean = 37/5 = 7,4.<br>Median = 7.<br>Modus = 7.</p><h4>b. Peluang</h4><p><span class=\"m\">P(A) = n(A) / n(S)</span></p><p>Contoh:<br>Dalam kotak ada 4 bola merah dan 6 bola biru.<br>Peluang merah = 4/10 = 2/5.</p>"}, {"t": "Trigonometri", "h": "<p>Perbandingan trigonometri:</p><p><div class=\"mb\">sin θ = depan / miring</div></p><p><div class=\"mb\">cos θ = samping / miring</div></p><p><div class=\"mb\">tan θ = depan / samping</div></p><p>Nilai penting:</p><div class=\"tw\"><table><tr><th>Sudut</th><th>sin</th><th>cos</th><th>tan</th></tr><tr><td>30°</td><td>1/2</td><td><span class=\"m\">√3/2</span></td><td><span class=\"m\">√3/3</span></td></tr><tr><td>45°</td><td><span class=\"m\">√2/2</span></td><td><span class=\"m\">√2/2</span></td><td>1</td></tr><tr><td>60°</td><td><span class=\"m\">√3/2</span></td><td>1/2</td><td><span class=\"m\">√3</span></td></tr></table></div>"}], "pas": "", "qs": [{"q": "<p>Hasil dari <span class=\"m\">12 + 4 × (6 - 2)<sup>2</sup></span> adalah …</p>", "o": ["28", "44", "64", "76", "100"], "a": 3, "e": "<span class=\"m\">12 + 4 × 16 = 76</span>."}, {"q": "<p>Jika <span class=\"m\">3x - 4 = 2x + 9</span>, maka nilai <span class=\"m\">x</span> adalah …</p>", "o": ["5", "9", "13", "15", "18"], "a": 2, "e": "<span class=\"m\">x = 13</span>."}, {"q": "<p>Harga sebuah tas Rp250.000. Setelah diskon 20%, harga tas menjadi …</p>", "o": ["Rp50.000", "Rp150.000", "Rp180.000", "Rp200.000", "Rp230.000"], "a": 3, "e": "diskon Rp50.000; harga akhir Rp200.000."}, {"q": "<p>Data nilai: 60, 70, 75, 80, 85, 90. Median data tersebut adalah …</p>", "o": ["72,5", "75", "77,5", "80", "82,5"], "a": 2, "e": "median = (75 + 80)/2 = 77,5."}, {"q": "<p>Sebuah tabung memiliki jari-jari 7 cm dan tinggi 10 cm. Volume tabung adalah …</p>", "o": ["220 cm³", "440 cm³", "1.540 cm³", "2.200 cm³", "3.080 cm³"], "a": 2, "e": "volume = <span class=\"m\">22/7 × 49 × 10 = 1.540</span> cm³."}]}, {"id": "pkwu", "n": "PKWU", "c": "#237A35", "g": "Wu", "topics": [{"t": "Peluang Usaha", "h": "<p>Peluang usaha muncul dari kebutuhan, masalah, atau keinginan pasar.</p><p>Langkah mengenali peluang usaha:</p><ol><li>Amati masalah masyarakat.</li><li>Identifikasi kebutuhan konsumen.</li><li>Analisis pesaing.</li><li>Tentukan produk atau jasa solusi.</li><li>Uji pasar melalui prototipe atau pre-order.</li></ol>"}, {"t": "Analisis SWOT", "h": "<div class=\"tw\"><table><tr><th>Elemen</th><th>Arti</th><th>Contoh</th></tr><tr><td>Strengths</td><td>Kekuatan internal</td><td>Produk unik, harga bersaing</td></tr><tr><td>Weaknesses</td><td>Kelemahan internal</td><td>Modal terbatas, produksi kecil</td></tr><tr><td>Opportunities</td><td>Peluang eksternal</td><td>Tren sehat, pasar digital</td></tr><tr><td>Threats</td><td>Ancaman eksternal</td><td>Banyak pesaing, bahan baku naik</td></tr></table></div>"}, {"t": "Segmentasi, Target, dan Positioning", "h": "<ul><li><b>Segmentasi:</b> membagi pasar berdasarkan usia, lokasi, pendapatan, gaya hidup, atau kebutuhan.</li><li><b>Target pasar:</b> kelompok konsumen yang dipilih.</li><li><b>Positioning:</b> citra produk di benak konsumen.</li></ul><p>Contoh:<br>Produk minuman sehat rendah gula untuk pelajar.<br>Segmentasi: pelajar.<br>Target: pelajar yang aktif dan peduli kesehatan.<br>Positioning: minuman sehat, murah, dan praktis.</p>"}, {"t": "Bauran Pemasaran 4P", "h": "<div class=\"tw\"><table><tr><th>Elemen</th><th>Penjelasan</th><th>Contoh</th></tr><tr><td>Product</td><td>Barang/jasa yang dijual</td><td>Keripik singkong pedas</td></tr><tr><td>Price</td><td>Harga jual</td><td>Rp10.000 per kemasan</td></tr><tr><td>Place</td><td>Tempat/distribusi</td><td>Kantin, marketplace, reseller</td></tr><tr><td>Promotion</td><td>Promosi</td><td>Media sosial, diskon, endorsement</td></tr></table></div>"}, {"t": "Biaya, Harga, dan Keuntungan", "h": "<ul><li><b>Biaya tetap:</b> tidak berubah terhadap jumlah produksi, misalnya sewa dan gaji tetap.</li><li><b>Biaya variabel:</b> berubah mengikuti jumlah produksi, misalnya bahan baku dan kemasan.</li><li><b>Total biaya:</b> biaya tetap + biaya variabel.</li><li><b>Pendapatan:</b> harga jual × jumlah terjual.</li><li><b>Laba:</b> pendapatan - total biaya.</li></ul><h4>Break-Even Point</h4><p><div class=\"mb\">BEP (unit) = (Biaya Tetap) / (Harga Jual - Biaya Variabel per Unit)</div></p><p>Contoh:<br>Harga jual Rp25.000, biaya variabel Rp15.000, biaya tetap Rp200.000.<br>Margin per unit = Rp10.000.<br>BEP = 200.000 / 10.000 = 20 unit.</p>"}, {"t": "Proposal Usaha", "h": "<p>Bagian proposal usaha:</p><ol><li>Judul usaha.</li><li>Latar belakang.</li><li>Visi dan misi.</li><li>Deskripsi produk.</li><li>Analisis pasar.</li><li>Strategi pemasaran.</li><li>Rencana produksi.</li><li>Rencana keuangan.</li><li>Analisis risiko.</li></ol>"}, {"t": "HaKI", "h": "<ul><li><b>Hak cipta:</b> melindungi karya kreatif seperti buku, musik, dan perangkat lunak.</li><li><b>Merek:</b> melindungi nama, logo, atau tanda pengenal usaha.</li><li><b>Paten:</b> melindungi invensi teknologi.</li><li><b>Desain industri:</b> melindungi bentuk visual produk.</li></ul>"}], "pas": "", "qs": [{"q": "<p>Seorang pelajar membuat produk sabun herbal. Ia melakukan survei terhadap calon pembeli untuk mengetahui kebutuhan dan harga yang sesuai. Kegiatan tersebut termasuk …</p>", "o": ["analisis pasar", "distribusi produk", "pengendalian mutu", "pencatatan keuangan", "pendaftaran merek"], "a": 0, "e": "survei calon pembeli adalah analisis pasar."}, {"q": "<p>Biaya bahan baku yang meningkat ketika jumlah produksi naik termasuk …</p>", "o": ["biaya tetap", "biaya variabel", "biaya promosi", "biaya sewa", "biaya administrasi"], "a": 1, "e": "biaya bahan baku berubah sesuai jumlah produksi."}, {"q": "<p>Harga jual produk Rp30.000, biaya variabel Rp18.000 per unit, dan biaya tetap Rp240.000. BEP usaha tersebut adalah …</p>", "o": ["10 unit", "15 unit", "20 unit", "25 unit", "30 unit"], "a": 2, "e": "margin Rp12.000; BEP = 240.000/12.000 = 20 unit."}, {"q": "<p>Strategi pemasaran yang paling sesuai untuk menjangkau pelajar dengan biaya rendah adalah …</p>", "o": ["iklan televisi nasional", "pemasaran melalui media sosial", "sewa papan iklan besar", "mencetak katalog mahal", "mengadakan pameran internasional"], "a": 1, "e": "media sosial relatif murah dan banyak digunakan pelajar."}]}, {"id": "pplg", "n": "PPLG", "c": "#6741D9", "g": "{ }", "topics": [{"t": "Pengembangan Perangkat Lunak", "h": "<p>SDLC atau System Development Life Cycle terdiri atas:</p><ol><li><b>Planning:</b> menentukan tujuan, anggaran, dan jadwal.</li><li><b>Analysis:</b> mengidentifikasi kebutuhan pengguna.</li><li><b>Design:</b> merancang tampilan, alur, basis data, dan arsitektur.</li><li><b>Implementation:</b> menulis kode program.</li><li><b>Testing:</b> menguji kesalahan dan kesesuaian fungsi.</li><li><b>Deployment:</b> merilis aplikasi.</li><li><b>Maintenance:</b> memperbaiki bug dan meningkatkan fitur.</li></ol>"}, {"t": "Kebutuhan Perangkat Lunak", "h": "<ul><li><b>Kebutuhan fungsional:</b> fitur yang harus dilakukan sistem. Contoh: pengguna dapat login, mencari produk, dan melakukan pembayaran.</li><li><b>Kebutuhan nonfungsional:</b> kualitas sistem. Contoh: aplikasi cepat, aman, mudah digunakan, dan dapat diakses banyak pengguna.</li></ul>"}, {"t": "Algoritma dan Flowchart", "h": "<p>Algoritma adalah urutan langkah logis untuk menyelesaikan masalah.</p><p>Contoh algoritma menentukan bilangan genap:</p><ol><li>Masukkan bilangan.</li><li>Bagi bilangan dengan 2.</li><li>Jika sisa 0, cetak “genap”.</li><li>Jika tidak, cetak “ganjil”.</li></ol><p>Simbol flowchart:</p><ul><li>Oval: mulai/selesai.</li><li>Jajar genjang: input/output.</li><li>Persegi panjang: proses.</li><li>Belah ketupat: keputusan.</li><li>Panah: arah alur.</li></ul>"}, {"t": "Dasar Pemrograman", "h": "<h4>a. Variabel dan tipe data</h4><div class=\"tw\"><table><tr><th>Tipe data</th><th>Contoh</th></tr><tr><td>Integer</td><td>10</td></tr><tr><td>Float</td><td>3.5</td></tr><tr><td>String</td><td>“TKA”</td></tr><tr><td>Boolean</td><td>true/false</td></tr></table></div><h4>b. Percabangan</h4><pre>if nilai &gt;= 75 then\n    status = &quot;Lulus&quot;\nelse\n    status = &quot;Tidak Lulus&quot;\nendif</pre><h4>c. Perulangan</h4><pre>for i = 1 to 5 do\n    print i\nendfor</pre><p>Output: 1, 2, 3, 4, 5.</p>"}, {"t": "Basis Data", "h": "<p>Basis data menyimpan data secara terstruktur.</p><p>Istilah penting:</p><ul><li><b>Tabel:</b> kumpulan data.</li><li><b>Field/kolom:</b> atribut data, misalnya nama atau nilai.</li><li><b>Record/baris:</b> satu data lengkap.</li><li><b>Primary key:</b> identifier unik.</li><li><b>Foreign key:</b> penghubung antartabel.</li></ul><p>Relasi:</p><ul><li>One-to-one: satu data terhubung satu data.</li><li>One-to-many: satu data terhubung banyak data.</li><li>Many-to-many: banyak data terhubung banyak data.</li></ul><p>Contoh:<br>Satu siswa memiliki banyak nilai, tetapi satu nilai hanya milik satu siswa. Relasinya one-to-many.</p>"}, {"t": "Pengujian Perangkat Lunak", "h": "<div class=\"tw\"><table><tr><th>Jenis</th><th>Penjelasan</th></tr><tr><td>Black-box testing</td><td>Menguji fungsi dari sisi pengguna tanpa melihat kode</td></tr><tr><td>White-box testing</td><td>Menguji logika internal kode</td></tr><tr><td>Unit testing</td><td>Menguji bagian kecil program</td></tr><tr><td>Integration testing</td><td>Menguji hubungan antarmodul</td></tr><tr><td>User acceptance testing</td><td>Menguji kesesuaian dengan kebutuhan pengguna</td></tr></table></div>"}, {"t": "Pengembangan Gim", "h": "<p>Komponen gim:</p><ul><li><b>Game mechanics:</b> aturan dan sistem permainan.</li><li><b>Gameplay:</b> pengalaman bermain.</li><li><b>Level design:</b> perancangan tahapan.</li><li><b>User interface:</b> tampilan menu dan tombol.</li><li><b>User experience:</b> kenyamanan pemain.</li><li><b>Asset:</b> gambar, suara, animasi, dan model 3D.</li><li><b>Game engine:</b> perangkat lunak untuk membangun gim, misalnya Unity atau Godot.</li></ul>"}], "pas": "", "qs": [{"q": "<p>Tahap mengidentifikasi kebutuhan pengguna sebelum aplikasi dibuat disebut …</p>", "o": ["planning", "analysis", "testing", "deployment", "maintenance"], "a": 1, "e": "tahap analysis mengidentifikasi kebutuhan pengguna."}, {"q": "<p>Perhatikan pseudocode:</p><pre>nilai = 78\nif nilai &gt;= 75 then\n    print &quot;Lulus&quot;\nelse\n    print &quot;Tidak Lulus&quot;\nendif</pre><p>Output program adalah …</p>", "o": ["78", "Lulus", "Tidak Lulus", "Error", "Tidak ada output"], "a": 1, "e": "78 &gt;= 75, sehingga output “Lulus”."}, {"q": "<p>Pada basis data perpustakaan, satu anggota dapat meminjam banyak buku, tetapi satu data peminjaman hanya dimiliki satu anggota. Relasinya adalah …</p>", "o": ["one-to-one", "one-to-many", "many-to-many", "tidak berelasi", "primary key"], "a": 1, "e": "satu anggota memiliki banyak peminjaman."}, {"q": "<p>Pengujian yang mengecek apakah tombol login berfungsi tanpa memeriksa kode program disebut …</p>", "o": ["white-box testing", "black-box testing", "debugging", "compiling", "documentation"], "a": 1, "e": "black-box testing menguji fungsi dari luar kode."}, {"q": "<p>Aturan tentang cara pemain memperoleh poin, kehilangan nyawa, dan menang dalam gim disebut …</p>", "o": ["game mechanics", "game asset", "user interface", "sound design", "game engine"], "a": 0, "e": "aturan permainan disebut game mechanics."}]}], "plan": "<div class=\"tw\"><table><tr><th>Hari</th><th>Fokus belajar</th></tr><tr><td>1</td><td>Bahasa Indonesia: ide pokok, fakta-opini, makna kata</td></tr><tr><td>2</td><td>Bahasa Indonesia: inference, teks eksposisi, evaluasi argumen</td></tr><tr><td>3</td><td>Bahasa Inggris: main idea, vocabulary, reference words</td></tr><tr><td>4</td><td>Bahasa Inggris: inference, jenis teks, writer’s purpose</td></tr><tr><td>5</td><td>Matematika: bilangan, pecahan, persen, rasio</td></tr><tr><td>6</td><td>Matematika: aljabar, SPLDV, fungsi dan invers</td></tr><tr><td>7</td><td>Matematika: geometri, pengukuran, trigonometri</td></tr><tr><td>8</td><td>Matematika: statistika, peluang, program linear</td></tr><tr><td>9</td><td>PKWU: peluang usaha, SWOT, segmentasi pasar</td></tr><tr><td>10</td><td>PKWU: 4P, biaya, harga, BEP, proposal usaha</td></tr><tr><td>11</td><td>PPLG: SDLC, kebutuhan perangkat lunak, flowchart</td></tr><tr><td>12</td><td>PPLG: algoritma, pemrograman, basis data</td></tr><tr><td>13</td><td>PPLG: pengujian, dokumentasi, konsep gim</td></tr><tr><td>14</td><td>Simulasi penuh, review kesalahan, istirahat</td></tr></table></div>", "chk": ["Memahami kisi-kisi resmi setiap mapel.", "Mampu mengerjakan contoh soal resmi Pusmendik.", "Menguasai konsep dasar, bukan hanya menghafal rumus.", "Terbiasa membaca soal panjang dan mengelola waktu.", "Membuat catatan kesalahan dan memperbaikinya.", "Menjaga tidur, nutrisi, dan kondisi mental menjelang ujian."]};
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let user=ls('tka_user',''),P={},Q=null;
const key=()=>'tka:'+(user||'tamu'),load=()=>{P=ls(key(),{})},save=()=>sv(key(),P);
const $=s=>document.querySelector(s),app=$('#app'),S=id=>D.subj.find(s=>s.id==id);
const rd=id=>Object.keys(P.m||{}).filter(k=>k.startsWith(id+'|')).length,L='ABCDE';
const V={
home(){
 app.innerHTML=`<h1>Siap TKA 2026,<br>satu mapel setiap kali</h1><p class="mu">Baca ringkasan materi, kerjakan latihan, lalu buka pembahasan lengkap setelah selesai.</p>
 <div class="card"><label for="nm" class="sm mu">Nama panggilan, agar progresmu tersimpan terpisah</label><div class="row"><input id="nm" value="${user}" placeholder="Contoh: Rani" maxlength="20"><button class="btn" id="go">Simpan nama</button></div></div>
 <div class="grid">${D.subj.map(s=>{const p=P[s.id],r=rd(s.id);return `<a class="card sc" style="--c:${s.c}" href="#/mapel/${s.id}"><div class="ic">${s.g}</div><h3>${s.n}</h3><p class="mu sm">${s.topics.length} topik materi, ${s.qs.length} soal latihan</p><div class="pb"><i style="width:${r/s.topics.length*100}%"></i></div><p class="mu sm" style="margin:0">Dipelajari ${r} dari ${s.topics.length} topik. ${p&&p.best!=null?'Skor terbaik '+p.best+'%.':'Latihan belum dicoba.'}</p></a>`}).join('')}</div>
 <a class="card sc" href="#/rencana" style="--c:var(--pri)"><h3>Rencana belajar 14 hari dan checklist</h3><p class="mu sm" style="margin:0">Urutan belajar dari hari pertama sampai simulasi penuh.</p></a>`;
 $('#go').onclick=()=>{user=$('#nm').value.replace(/[<>"&]/g,'').trim();sv('tka_user',user);load();route()};
},
mapel(id){const s=S(id);
 app.innerHTML=`<div style="--c:${s.c}"><div class="hd"><div class="ic">${s.g}</div><div><h1>${s.n}</h1><p>Ringkasan materi dan latihan soal</p></div></div>
 <div class="row"><a class="btn" href="#/mapel/${id}">Materi</a><a class="btn g" href="#/kuis/${id}">Latihan soal (${s.qs.length})</a></div>
 ${s.topics.map((t,i)=>`<details data-k="${id}|${i}"><summary>${(P.m||{})[id+'|'+i]?'✓ ':''}${t.t}</summary><div class="dt pr">${t.h}</div></details>`).join('')}
 <p><a class="btn" href="#/kuis/${id}">Kerjakan latihan ${s.n}</a></p></div>`;
 app.querySelectorAll('details').forEach(d=>d.ontoggle=()=>{if(d.open){(P.m=P.m||{})[d.dataset.k]=1;save()}});
},
kuis(id){const s=S(id);if(!Q||Q.id!=id)Q={id,i:0,a:[]};const i=Q.i,q=s.qs[i],n=Q.a.filter(x=>x!=null).length;
 app.innerHTML=`<div style="--c:${s.c}"><h2>${s.n}: latihan soal</h2><div class="pb"><i style="width:${n/s.qs.length*100}%"></i></div>
 <p class="mu sm">${n} dari ${s.qs.length} soal terjawab. Pembahasan terbuka setelah kamu menekan Selesai.</p>
 <div class="ng">${s.qs.map((_,j)=>`<button class="${Q.a[j]!=null?'d':''} ${j==i?'cur':''}" data-j="${j}" aria-label="Soal ${j+1}">${j+1}</button>`).join('')}</div>
 ${s.pas?`<div class="card pr" style="margin-top:12px">${s.pas}</div>`:''}
 <div class="card" style="margin-top:12px"><p class="mu sm">Soal ${i+1} dari ${s.qs.length}</p><div class="pr">${q.q}</div>
 ${q.o.map((o,k)=>`<button class="op ${Q.a[i]===k?'sel':''}" data-k="${k}"><b>${L[k]}</b><span>${o}</span></button>`).join('')}</div>
 <div class="row sp"><button class="btn g" id="pv" ${i?'':'disabled'}>Sebelumnya</button>${i<s.qs.length-1?'<button class="btn" id="nx">Berikutnya</button>':'<button class="btn" id="fn">Selesai dan lihat hasil</button>'}</div></div>`;
 app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{Q.a[i]=+b.dataset.k;V.kuis(id)});
 app.querySelectorAll('.ng button').forEach(b=>b.onclick=()=>{Q.i=+b.dataset.j;V.kuis(id)});
 $('#pv').onclick=()=>{Q.i--;V.kuis(id)};
 if($('#nx'))$('#nx').onclick=()=>{Q.i++;V.kuis(id)};
 if($('#fn'))$('#fn').onclick=()=>{const a=s.qs.map((_,j)=>Q.a[j]??null),un=a.filter(x=>x==null).length;
  if(un&&!confirm(un+' soal belum dijawab. Tetap selesai?'))return;
  const ok=a.filter((x,j)=>x===s.qs[j].a).length,pc=Math.round(ok/s.qs.length*100),p=P[id]||{};
  P[id]={...p,best:Math.max(p.best??0,pc),last:pc,n:(p.n||0)+1,ans:a};save();Q=null;location.hash='#/hasil/'+id};
},
hasil(id){const s=S(id),p=P[id];if(!p||!p.ans){location.hash='#/kuis/'+id;return}
 const ok=p.ans.filter((x,j)=>x===s.qs[j].a).length;
 app.innerHTML=`<div style="--c:${s.c}"><div class="card res" style="margin-top:16px"><p class="mu">Hasil ${s.n}</p><div class="big">${p.last}%</div><p>${ok} dari ${s.qs.length} soal benar. ${p.last>=80?'Kuat, pertahankan.':p.last>=60?'Sudah baik, perdalam bagian yang salah.':'Baca ulang materinya, lalu coba lagi.'}</p><p class="mu sm">Skor terbaik ${p.best}%. Dikerjakan ${p.n} kali.</p><div class="row"><a class="btn" href="#/kuis/${id}" onclick="Q=null">Ulangi latihan</a><a class="btn g" href="#/mapel/${id}">Baca materi</a></div></div>
 <h2>Jawaban dan pembahasan</h2>${s.pas?`<div class="card pr">${s.pas}</div>`:''}
 ${s.qs.map((q,j)=>{const u=p.ans[j],r=u===q.a;return `<div class="card"><span class="bd ${u==null?'na':r?'ok':'no'}">${u==null?'Tidak dijawab':r?'Benar':'Salah'}</span><div class="pr">${q.q}</div>
 ${q.o.map((o,k)=>`<div class="op ${k==q.a?'ok':k===u?'no':''}"><b>${L[k]}</b><span>${o}${k==q.a?' (jawaban benar)':k===u?' (jawabanmu)':''}</span></div>`).join('')}
 <div class="ex ${r?'ok':'no'}"><b>${r?'Kenapa jawabanmu benar':'Kenapa jawabanmu kurang tepat'}</b><p>${r?'':(u==null?'Kamu tidak memilih jawaban. ':'Kamu memilih '+L[u]+'. ')+'Jawaban yang tepat adalah '+L[q.a]+'. '}${q.e}</p></div></div>`}).join('')}</div>`;
},
rencana(){
 app.innerHTML=`<h2>Rencana belajar 14 hari</h2><div class="pr">${D.plan}</div><h2>Checklist kesiapan</h2><div class="card">${D.chk.map((t,i)=>`<label class="ck"><input type="checkbox" data-i="${i}" ${(P.c||{})[i]?'checked':''}><span>${t}</span></label>`).join('')}</div>`;
 app.querySelectorAll('.ck input').forEach(c=>c.onchange=()=>{(P.c=P.c||{})[c.dataset.i]=c.checked;save()});
}};
function route(){const [r,id]=location.hash.slice(2).split('/');(V[r]||V.home)(id);scrollTo(0,0);
 $('#who').textContent=user?'Halo, '+user:'Mode tamu';
 $('#nv').innerHTML=[['','Beranda'],...D.subj.map(s=>['mapel/'+s.id,s.n,s.c]),['rencana','Rencana 14 hari']].map(([h,t,c])=>{
  const on=h?(h=='rencana'?r=='rencana':id==h.slice(6)):!r;
  return `<a href="#/${h}" class="${on?'on':''}" style="--c:${c||'var(--pri)'}">${t}</a>`}).join('');}
load();addEventListener('hashchange',route);route();
</script></body></html>
